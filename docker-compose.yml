version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: easy-rent-db
    environment:
      POSTGRES_USER: easyrent
      POSTGRES_PASSWORD: easyrent_password
      POSTGRES_DB: easyrent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyrent"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: easy-rent-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@easyrent.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
